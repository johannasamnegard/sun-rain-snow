<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/main.css" />
    <title>Weather App</title>
    <link rel="icon" type="imgage/x-icon" href="/src/public/img/favicon.png"/>
  </head>
  <body>

    <!-- Decorative rain, prints behind main -->
    <div id="weatherEffects" class="weather-effect" aria-hidden="true"></div>

    <script>(function (){
      try {
        var saved = localStorage.getItem("saveWeather")
        if (!saved) return
        var parsed = JSON.parse(saved)
        document.body.classList.add("has-saved-weather")
        if (!parsed.icon) return
        document.body.classList.add("weather-bg-" + parsed.icon)
      } catch (e) {}
    })()</script>
    <main>

        <div class="search-wrapper">
          
          <form id="searchForm">
            <input
              type="text"
              id="searchInput"
              autocomplete="off"
              name="city"
              placeholder="Enter city name"
              class="search-input"
            />
            <button type="submit" class="search-button">
              <span class="search-button-content">
                <i data-lucide="search" class="search-icon"></i>
                Search
              </span>
            </button>
          </form>
          <div id="searchDropdown" class="search-dropdown"></div>

        </div>


      <div id="savedCitiesList"></div>

    <dialog id="maxCitiesDialog">
      <p>You can only save up to 6 cities</p>
    </dialog>

      <div id="weatherList">
        <div id="weatherPlaceholder" class="weather-panel welcome-panel panel-bg-cloud-sun"><i data-lucide="cloud-sun-rain" class="start-icon"></i>
          <p class="placeholder-empty-text">Search for a city to see the weather</p>
          <p class="placeholder-loading-text">Loading weather...</p>
        </div>
      </div>

      <div id="forecastList"></div>

      <button id="hourlyToggle" class="hourly-toggle" type="button" hidden>Hourly forecast <i data-lucide="chevron-down" class="hourly-toggle-icon"></i></button>
      <div id="hourlyList" hidden></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
